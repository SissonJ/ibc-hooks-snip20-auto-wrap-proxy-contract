[workspace]
resolver = "2"
members  = [
  "contracts/hook",
]

[workspace.package]
version       = "0.3.0"
authors       = ["Jack Sisson <SissonJ>"]
edition       = "2021"
rust-version  = "1.71.0"
keywords      = ["cosmwasm"]

[workspace.dependencies]
cosmwasm-schema      = "1.5.4"
cosmwasm-std = { package = "secret-cosmwasm-std", version = "1.1.11", features = ["stargate"]}
secret-toolkit = { git = "https://github.com/scrtlabs/secret-toolkit", tag = "v0.10.0" }
ibc-proto            = { version = "0.32.1", default-features = false }
mockall              = "0.12.1"
prost                = "0.11"
serde                = { version = "1.0.194", default-features = false, features = ["derive"] }
serde-cw-value       = "0.7.0"
serde-json-wasm      = "1.0.1"
test-case            = "3.3.1"
thiserror            = "1"
base64ct             = "=1.6.0"

[profile.release]
codegen-units    = 1
debug            = false
debug-assertions = false
incremental      = false
lto              = true
opt-level        = 3
overflow-checks  = true
rpath            = false
