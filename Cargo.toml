[package]
name = "ibc-hooks-snip20-auto-wrap-proxy-contract"
version = "0.0.0"
authors = ["SCRT Labs <info@scrtlabs.com>"]
edition = "2018"
description = "A compact contract that can be called using IBC hooks to wrap incoming token transfers as SNIP-20 tokens"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
default = []
backtraces = ["cosmwasm-std/backtraces"]
with_floats = []

[dependencies]
cosmwasm-schema      = "1.5.4"
cosmwasm-std = { package = "secret-cosmwasm-std", version = "1.1.11", features = ["stargate"]}
serde                = { version = "1.0.194", default-features = false, features = ["derive"] }
